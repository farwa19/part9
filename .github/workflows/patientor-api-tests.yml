name: Patientor API Tests

on:
  push:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install patientor backend dependencies
        working-directory: ./patientor/backend
        run: npm ci

      - name: Lint patientor backend
        working-directory: ./patientor/backend
        run: npm run lint

      - name: Install test dependencies
        working-directory: ./patientor-api-tests
        run: npm ci

      - name: Install Playwright browsers
        working-directory: ./patientor-api-tests
        run: npx playwright install --with-deps chromium

      - name: Run API tests
        working-directory: ./patientor-api-tests
        run: npm test

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: patientor-api-tests/playwright-report/
          retention-days: 30